<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Animal Fact File</title>
    <style>
      body {
        background-color: rgb(21, 175, 21);
        font-family: Arial, sans-serif;
      }
      .fact-file {
        background-color: lightyellow;

        color: darkslategray;

        width: 260px;

        padding: 25px;

        border: 4px solid forestgreen;

        margin: 30px;
      }
      .animal-name {
        font-size: 22px;
        font-weight: bold;
        color: forestgreen;
      }
      .detail {
        color: darkslategray;
      }
      .cool-fact {
        font-style: italic;
        color: darkorange;
      }
    </style>
  </head>
  <body>
    <div class="fact-file">
      <div class="animal-name">Cheetah</div>
      <div class="detail">
        The cheetah is the fastest land animal, capable of reaching speeds up to
        60-70 mph.
      </div>
      <div class="detail">Cheetahs are found in Africa and parts of Iran.</div>
      <div class="detail">
        Cheetahs are carnivorous and primarily hunt small to medium-sized prey.
      </div>
      <div class="cool-fact">
        Cool Fact: Cheetahs can accelerate from 0 to 60 mph in just a few
        seconds!
      </div>
    </div>
  </body>
</html>
