<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOTSTRAP</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <style>
        body {
            background-color: #f8f9fa;
            font-family: helvetica, sans-serif;
            padding: 30px 15px;

        }
        h1 {
            color: orange;
            text-align: center;
        }
        .hobby-card {
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid orange;
            border-radius: 8px;
            padding: 20px;
            background-color: #fff3e0;

        }
        .hobby-card h3 {
            color: #ff5722;
           
        }
    </style>
  </head>
  <body>
    <h1>My Hobbies and their cards</h1>
    <div class="container">
      <div class="row">
        <div class="col-md-4 hobby-card">
          <h3>Reading</h3>
          <p>I love reading books, especially fiction and fantasy novels.</p>
        </div>
        <div class="col-md-4 hobby-card">
          <h3>Traveling</h3>
          <p>Exploring new places and experiencing different cultures is my passion.</p>
        </div>
        <div class="col-md-4 hobby-card">
          <h3>Photography</h3>
          <p>Capturing moments through the lens is a creative outlet for me.</p>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
