<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Doctor's appointment</title>
  </head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Doctor's appointment</title>

  <body>
    <h1>My doctor's appointment</h1>
    <p>Please fill out the form below to schedule your appointment.</p>
    <hr />
    <form>
      <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required /><br /><br />

        <label for="birthday">Birthday:</label>
        <input type="date" id="birthday" name="birthday" required /><br /><br />
        <label for="password">Password:</label>
        <input
          type="password"
          id="pid"
          placeholder="Your secret ID"
          required
        /><br /><br />
      </fieldset>
      <br />
      <fieldset>
        <legend>Your Visit Information</legend>
        <label> Choose your doctor</label><br />
        <select id="doctor">
          <option value="">-- Please select a doctor --</option>
          <option value="dr_adyan">Dr. Adyan-Teeth</option>
          <option value="dr_raheel">Dr. Raheel-Heart</option>
          <option value="dr_samdani">Dr. Samdani-Skin</option>
          <option value="dr_ayan">Dr. Ayan-Eyes</option></select
        ><br /><br />
        <label>Why are you visiting?</label><br />
        <input type="radio" name="reason" value="fever" /> Fever<br />
        <input type="radio" name="reason" value="cough" /> Checkup<br />
        <input type="radio" name="reason" value="headache" /> Cold<br />
        <input type="radio" name="reason" value="tooth pain" /> Tooth Pain<br />
        <input type="radio" name="reason" value="skin rash" /> Skin Rash<br />
        <input type="radio" name="reason" value="eye pain" /> Eye Pain<br />
        <input type="radio" name="reason" value="other" /> Other<br /><br />
        <label> Any notes for the doctor?</label><br />
        <textarea
          id="notes"
          name="notes"
          rows="3"
          cols="35"
          placeholder="e.g. i have had a really bad fever for 3-4 days"
        ></textarea
        ><br /><br />
      </fieldset>
      <br />
    </form>
  </body>
</html>
