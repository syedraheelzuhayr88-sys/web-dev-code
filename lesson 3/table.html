<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="1" cellpadding="10" cellspacing="10">
        <caption>My Student Table</caption>
      <!-- Table header -->
      <thead bgcolor="blue">
        <tr>
          <th>Student ID</th>
          <th>Student Name</th>
          <th>Student Score</th>
        </tr>
      </thead>
      <!-- Table Body -->
      <tbody bgcolor="lightgreen">
        <tr>
          <!-- First Row -->
          <td>S001</td>
          <td>Raheel</td>
          <td>92</td>
        </tr>
        <!-- Second Row -->
        <tr>
          <td>S002</td>
          <td>Rafsan</td>
          <td>94</td>
        </tr>
        <!-- Third Row -->
        <tr>
          <td>S003</td>
          <td>Adil</td>
          <td>96</td>
        </tr>
      </tbody>

      <!-- Table Footer -->
      <tfoot bgcolor="lightblue">
        <tr>
          <td>Total</td>
          <td colspan="2" align="center">282</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
